<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepseekHarness</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <!-- 标题栏：已改用系统原生标题栏（tauri.conf.json → windows[0].decorations = true）。
         原先自绘的 .titlebar（含最小化/最大化/关闭按钮）在此移除，窗口控制与拖拽由系统提供。 -->

    <!-- 加载态：终端日志 -->
    <div id="loading-view" class="loading-view">
        <div class="loading-title">程序启动中</div>
        <div class="loading-spinner"></div>
        <div class="terminal-box">
            <div class="terminal-header">
                <svg viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="1" stroke="currentColor" stroke-width="0.8"/><path d="M3 5L5 7L9 3" stroke="currentColor" stroke-width="0.8" fill="none"/></svg>
                <span>dsh web</span>
            </div>
            <div id="terminal-body" class="terminal-body"></div>
        </div>
    </div>

    <!-- WebView 态：服务就绪后显示（dsh 在独立新窗口中弹出，主窗口这里仅显示提示文字）
         Tauri 1.x 没有嵌入式 webview API，必须由 Rust 端 WindowBuilder 创建独立新窗口加载 dsh。
         见 src-tauri/src/lib.rs::open_dsh_webview_window。 -->
    <div id="webview-view" class="webview-view hidden"></div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
